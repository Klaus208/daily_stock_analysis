name: enhanced_decision_v6
description: 增强版个股决策策略 v6（方案Y三层市场环境过滤 + BOLL宽度分位 + 1.5ATR止损 + 三档减仓）
version: 6.0

# ============================================================
# 标的属性与周期诊断
# ============================================================
cycle_diagnosis:
  rules:
    - name: 波动率分级
      high_vol_atr_pct: 4.0        # ATR14/现价 > 此值视为高波动
      low_vol_atr_pct: 1.5

    - name: 周期判定权重
      weights:
        trend_strength: 0.30       # MA5/MA20/MA60 多头排列程度
        macd_zero_pos: 0.25        # DIF/DEA 距零轴距离
        kdj_extreme: 0.20          # J值超买超卖极端程度
        volatility: 0.15           # ATR 波动率
        volume_activity: 0.10      # 量比活跃度

    - name: 零轴纠缠态优先判中线
      # DIF 与 DEA 异侧 或 同侧距零轴 < 0.5ATR → 强制中线波段
      zero_axis_tangle_atr_mult: 0.5
      force_mid_term_when_tangled: true

    - name: BOLL宽度分位辅助
      # 宽度分位 ≤20% → 极致收口蓄势 → 不判超短线，判中线网格等突破
      # 宽度分位 ≥80% → 张口加速 → 顺势做多
      boll_width_rank_threshold_extreme: 0.20
      boll_width_rank_threshold_wide: 0.80

    - name: 周期映射
      short_term: 超短线博弈(1-3天)
      mid_term: 中线波段网格(1-4周)
      long_term: 长线配置(6个月+)

# ============================================================
# 点位精算
# ============================================================
price_targets:
  high_vol_threshold_atr_pct: 4.0
  high_vol:
    stop_loss_atr_mult: 1.5        # 最终止损 = 现价 - 1.5*ATR14
    stage1_atr_mult: 0.5           # 第一档减仓 = 现价 - 0.5*ATR
    stage2_atr_mult: 1.0           # 第二档减仓 = 现价 - 1.0*ATR
    buy_zone:
      upper: close - 0.0 * ATR
      lower: close - 0.5 * ATR
    support_primary: max(close - 1.5 * ATR, dense_lower)
    support_secondary: MA20
    resistance_primary: close + 1.5 * ATR
    resistance_secondary: BOLL上轨
  low_vol:
    stop_loss_pct: 3.0
    stage1_pct: 1.0
    stage2_pct: 2.0
    buy_zone_pct: [-3.0, 0.0]
  fallback_use_ma20: true

# ============================================================
# 量价状态枚举
# ============================================================
volume_price_states:
  - 放量突破
  - 放量滞涨
  - 缩量阴跌
  - 缩量观望（阴跌企稳）
  - 缩量洗盘
  - 温和放量上涨
  - 价跌量增出逃

# ============================================================
# BOLL 宽度四档分类
# ============================================================
boll_width_classification:
  <=0.20: 🔒极致收口/蓄势
  0.20~0.40: 收口
  0.40~0.80: 常态
  >=0.80: 🚀张口加速

# ============================================================
# 大盘环境过滤规则（方案Y · 三层架构）
# 优先级最高，先于周期诊断执行
# ============================================================
market_filter:
  priority: 0

  # 第1层：市场级
  layer1_market:
    a_indices: [上证指数, 创业板指, 中证1000]
    a_indices_all_above_ma20: true    # 三指数都站上MA20
    a_adv_dec_ratio_threshold: 1.0   # 全市场涨跌比阈值
    hk_hsi_above_ma20: true
    hk_adv_dec_ratio_threshold: 1.0

  # 第2层：风格指数（按股票代码自动映射）
  layer2_style:
    mapping:
      科创板: 科创50
      创业板: 创业板指
      沪深的: 上证50
      港股: 恒生指数
      北交所: 中证1000

  # 第3层：行业板块
  layer3_industry:
    factors:
      - above_ma20: true             # 板块指数站上MA20
      - relative_strength_vs_hs300: true  # 板块20日收益 > 沪深300
      - fund_inflow: true            # 板块主力净流入

  # 汇总规则（保守：取较差）
  summary_rules:
    bull: "市场级bull AND 风格指数站上MA20 AND 行业三因子全通过"
    sideways: "非bull且非bear（任一条件不满足但非全面恶化）"
    bear: "市场级bear OR (风格未站上MA20 AND 行业因子多数不通过)"

  # 降级策略
  on_failure:
    index_api_fail: "降级到上一层判定"
    industry_unknown: "行业因子视为通过（保守放行）"
    all_failed: "强制 sideways（禁止趋势做多）"

# ============================================================
# 环境→策略映射
# ============================================================
environment_strategy:
  bull:
    allow_periods: [超短线博弈(1-3天), 中线波段网格(1-4周), 长线配置(6个月+)]
    stop_loss_atr_mult: 1.5
    max_position: 100%
    note: "允许按个股技术面判定推荐周期"
  sideways:
    force_period: 超短线博弈(1-3天)
    stop_loss_atr_mult: 1.0
    max_position: 50%
    note: "禁止中线持仓，所有操作降级为超短线"
  bear:
    force_period: 空仓观望
    max_position: 0%
    note: "禁止任何做多，已持仓建议次日开盘清仓"

# ============================================================
# LLM 输出指令（最终模板 v6）
# ============================================================
instructions: |
  你是一位严谨的量化分析师。基于下方技术指标 JSON 和 市场环境 JSON，
  为这只标的生成一份「傻瓜式」决策报告。严格按【输出模板】的格式输出，
  不得增删章节、不得改变加粗标记。

  【核心铁律】
  1. 所有价位必须来自下方数据，不得编造；数据缺失时写"暂无数据"，禁止臆造。
  2. 周期诊断先看环境：
     - 若 env.environment == "bear" → 强制「空仓观望」，不输出买卖预案。
     - 若 env.environment == "sideways" → 强制「超短线博弈(1-3天)」，止损用1.0×ATR。
     - 若 env.environment == "bull" → 按技术面判定周期，止损用1.5×ATR。
  3. 零轴纠缠判定：
     - 若 macd.dif_zero_dist_atr < 0.5 且 trend 非强多/强空 → 强制「中线波段网格」。
  4. BOLL宽度分位：
     - 宽度分位 ≤ 20% → 标注「🔒极致收口/蓄势」，判中线等突破，不判超短线。
     - 宽度分位 ≥ 80% → 标注「🚀张口加速」，顺势做多。
  5. 点位精算（高波动 atr_pct>4%）：
     - 止损 = targets.stop_loss（已是 现价-1.5×ATR）
     - 支撑1 = targets.support1，支撑2 = targets.support2
     - 压力1 = targets.resistance1，压力2 = targets.resistance2
     - 买入区间 = targets.buy_zone[0] 至 targets.buy_zone[1]
     - 每个价位必须标注依据（BOLL上轨/MA20/ATR计算/密集成交区）
  6. 仓位管理必须给明确百分比数字，禁止"适量""适当"等模糊词。
  7. 三档减仓（env=bull 时）：
     - 跌破支撑位1 → 减仓30%
     - 跌破 stage2_price(-1×ATR) → 再减仓30%
     - 跌破止损位(-1.5×ATR) → 清仓
  8. 资金流数据缺失时，买入结论去掉"资金面确认"，改为"资金面暂无数据"。

  【输出模板（严格照抄章节标题与缩进）】

  #### 0. 个股市场环境过滤（方案Y·三层架构）
  * **市场层**：[A股/港股环境描述，含指数站上MA20状态与涨跌比]
  * **风格层**：[所属市场→对应风格指数及MA20状态]
  * **行业层**：[板块名称及MA20/相对强弱/资金流三因子]
  * **综合判定**：[bull ✅/ sideways ⚠️/ bear ❌ → 对应策略说明]

  #### 1. 标的属性与推荐策略周期
  * **标的属性**：[波动率等级+市场特点+所属行业，如"高波动科创板3D打印标的，ATR=6.7%，受机器人/PEEK材料题材驱动"]
  * **推荐交易周期**：[空仓观望 / 超短线博弈(1-3天) / 中线波段网格(1-4周) / 长线配置(6个月+)]
  * **决策理由**：[1-2句话，必须引用具体指标数值+环境判定，如"三层环境全bull+DIF零轴纠缠+J=87.6中性+BOLL张开94%→顺势做多"]

  #### 2. 技术面深度体检（多指标交叉）
  * **量价状态**：[从枚举中选一个 + 数据佐证，如"缩量观望（阴跌企稳），量比0.31，振幅1.8%"]
  * **BOLL布林线**：[价格相对三轨位置 + 宽度历史分位 + 四档标签，如"现价91.88位于中轨上方，上/中/下轨=99.14/81.10/63.05，宽度分位94%→🚀张口加速"]
  * **KDJ状态**：[K/D/J数值 + 超买超卖 + 金叉死叉，如"K=82.4 D=79.8 J=87.6，中性未超买(<90)，无金叉死叉"]
  * **MACD & RSI**：[DIF/DEA位置 + 红绿柱 + RSI数值，如"DIF=1.96 DEA=-0.49，零轴下金叉↑，红柱放大；RSI=64.3未超买"]
  * **多空共振**：[一句话总结，如"MACD金叉↑ + BOLL张口 + 板块资金流入 = 多头共振"]
  * **综合关键点位**：
    - **压力位1**：[X.X元]（依据：BOLL上轨/前高/密集成交区）
    - **压力位2**：[X.X元]（依据：）
    - **支撑位1**：[X.X元]（依据：MA20/ATR计算/BOLL中轨）
    - **支撑位2**：[X.X元]（依据：）
    - **止损位**：[X.X元]（依据：现价-1.5×ATR=-10.1%）

  #### 3. 傻瓜式交易预案（Action Plan）
  * **【已持仓三档减仓】**：
    - 跌破[支撑位1]减仓30%；
    - 跌破[stage2_price](-1×ATR)再减仓30%；
    - 跌破[止损位](-1.5×ATR)清仓，单笔最大亏损约[XX%]；
    - 带量突破[压力位1]且量比>1.5 → 加仓20%；
    - 触及[压力位2](BOLL上轨) → 减仓50%锁利。
  * **【未持仓/买入预案】**：
    - 首次建仓：[买入区间下界]元附近，单次≤总资金20%；
    - 加仓点：回踩[支撑位2](BOLL中轨)不破 → 加仓20%；
    - 止损位：[止损位]元（亏损约[XX%]即执行）；
    - 目标位：[压力位2]元（+XX%），盈亏比≈1:X。

  【输入数据】
  技术指标 JSON: {{analysis}}
  市场环境 JSON: {{market_env}}
